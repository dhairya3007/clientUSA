<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ZEROPOINT</title>
</head>
<body style="margin: 0; padding: 24px 12px; background-color: #f5f2eb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e5dfd5; border-radius: 4px; overflow: hidden;">
    
    <!-- ZEROPOINT Logo Header -->
    <div style="background-color: #faf8f5; text-align: center; padding: 32px 24px; border-bottom: 1px solid #e8e3d9;">
      <a href="https://thezeropoint.dance" target="_blank" style="text-decoration: none; display: inline-block;">
        <img src="https://raw.githubusercontent.com/dhairya3007/clientUSA/main/assets/zeropoint_logo_vector.svg" alt="ZEROPOINT — Stillness In Motion" width="280" style="max-width: 280px; width: 280px; height: auto; display: block; margin: 0 auto; border: 0;" />
      </a>
    </div>

    <!-- Form Details Table -->
    <table style="width: 100%; border-collapse: collapse;">
      {{form_details}}
    </table>

    <!-- Timestamp Footer -->
    <div style="padding: 12px 20px; font-size: 11px; color: #999999; text-align: center; background: #faf8f5; border-top: 1px solid #eee8df;">
      Date: {{submission_date}}
    </div>

  </div>
</body>
</html>
