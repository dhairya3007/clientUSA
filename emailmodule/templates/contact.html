<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ZEROPOINT</title>
</head>
<body style="margin: 0; padding: 24px 12px; background-color: #f5f2eb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e5dfd5; border-radius: 4px; overflow: hidden;">
    
    <!-- ZEROPOINT Logo Header -->
    <div style="background-color: #faf8f5; text-align: center; padding: 32px 24px 26px 24px; border-bottom: 1px solid #e8e3d9;">
      <a href="https://thezeropoint.dance" target="_blank" style="text-decoration: none; display: inline-block;">
        <img src="https://thezeropoint.dance/assets/zeropoint_logo_vector.svg" alt="ZEROPOINT" width="220" style="max-width: 220px; width: 220px; height: auto; display: block; margin: 0 auto 10px auto; border: 0;" />
        <div style="font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size: 24px; font-weight: 500; letter-spacing: 0.18em; color: #171815; text-transform: uppercase;">ZEROPOINT</div>
        <div style="font-family: -apple-system, Arial, sans-serif; font-size: 9.5px; font-weight: 600; letter-spacing: 0.24em; color: #C8A96B; text-transform: uppercase; margin-top: 4px;">STILLNESS IN MOTION</div>
      </a>
    </div>

    <!-- Form Details Table -->
    <table style="width: 100%; border-collapse: collapse;">
      {{form_details}}
    </table>

    <!-- Timestamp Footer -->
    <div style="padding: 12px 20px; font-size: 11px; color: #999999; text-align: center; background: #faf8f5; border-top: 1px solid #eee8df;">
      Date: {{submission_date}}
    </div>

  </div>
</body>
</html>
