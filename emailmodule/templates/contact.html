<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Contact Inquiry</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f1f5f9; padding: 24px; margin: 0; color: #1e293b; }
    .card { background: #ffffff; max-width: 560px; margin: 0 auto; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); }
    .header { background: #0f172a; padding: 22px 28px; color: #ffffff; }
    .header h2 { margin: 0; font-size: 19px; font-weight: 600; }
    .header p { margin: 4px 0 0; font-size: 13px; color: #94a3b8; }
    .body { padding: 28px; }
    .row { margin-bottom: 18px; }
    .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 4px; }
    .value { font-size: 15px; color: #0f172a; line-height: 1.5; }
    .divider { height: 1px; background: #f1f5f9; margin: 24px 0; }
    .footer { background: #f8fafc; padding: 16px 28px; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>New Contact Submission</h2>
      <p>{{website_name}} Inquiry Portal</p>
    </div>
    <div class="body">
      <div class="row">
        <div class="label">Full Name</div>
        <div class="value"><strong>{{name}}</strong></div>
      </div>
      <div class="row">
        <div class="label">Email Address</div>
        <div class="value"><a href="mailto:{{email}}" style="color: #2563eb; text-decoration: none;">{{email}}</a></div>
      </div>
      <div class="row">
        <div class="label">Phone Number</div>
        <div class="value">{{phone}}</div>
      </div>
      <div class="row">
        <div class="label">Subject</div>
        <div class="value">{{subject}}</div>
      </div>
      <div class="divider"></div>
      <div class="row">
        <div class="label">Message</div>
        <div class="value" style="white-space: pre-wrap;">{{message}}</div>
      </div>
    </div>
    <div class="footer">
      Received: {{submission_date}} | IP: {{client_ip}} | Source: {{page_url}}
    </div>
  </div>
</body>
</html>
